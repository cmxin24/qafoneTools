[package]
name = "qafone-tools"
version = "0.2.0"
edition = "2026"

# 将 lib crate 同时编译为静态库和动态库，满足 Tauri 的构建需求
[lib]
name = "qafone_tools_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# ─── 构建依赖 ────────────────────────────────────────────────────────────────
[build-dependencies]
tauri-build = { version = "2", features = [] }

# ─── 运行时依赖 ──────────────────────────────────────────────────────────────
[dependencies]
# Tauri 核心框架
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# 序列化 / 反序列化（用于 Tauri 命令参数及事件 payload）
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# 异步运行时（Tauri 内部已依赖，此处显式声明以使用 multi-thread）
tokio = { version = "1", features = ["full"] }

# HTTP 客户端：需要 stream feature 才能做流式下载
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", # 使用纯 Rust TLS，避免 OpenSSL 依赖
    "stream",     # 流式读取响应体（进度推送必须）
    "json",
] }

# Stream 工具（用于 while let Some(chunk) = stream.next().await）
futures-util = "0.3"

# 错误处理
anyhow = "1"

# 日志
tracing = "0.1"

# Whisper ASR (builds whisper.cpp from source — requires cmake + C++ compiler)
# Metal is only available on macOS; other platforms fall back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

# ─── Release 优化 ─────────────────────────────────────────────────────────────
[profile.release]
panic        = "abort"       # 去除 panic unwind 代码
codegen-units = 1            # 最大化 LTO 优化
lto          = true
opt-level    = "s"           # 优先缩减二进制体积
strip        = true          # 剥离调试符号
