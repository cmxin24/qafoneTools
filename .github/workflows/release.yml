name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "qafoneTools-v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            macos-deployment-target: "10.15"
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            macos-deployment-target: "10.15"
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            macos-deployment-target: ""
            args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: qafoneTools-v__VERSION__
          releaseName: qafoneTools v__VERSION__
          releaseBody: |
            qafoneTools desktop release.

            Built by GitHub Actions for macOS and Windows.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
